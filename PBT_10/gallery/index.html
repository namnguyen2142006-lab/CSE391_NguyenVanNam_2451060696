<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Scroll Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Infinite Scroll Gallery</h1>
    </header>

    <main>
      <div id="gallery" class="gallery"></div>

      <div id="loading" class="loading hidden">Đang tải thêm...</div>

      <div id="load-trigger"></div>
    </main>

    <div id="lightbox" class="lightbox hidden">
      <div class="lightbox-content">
        <img id="lightboxImage" src="" alt="Ảnh lớn" />
        <button id="closeLightbox">Đóng</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
