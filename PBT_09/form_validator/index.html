<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Đăng ký tài khoản</h1>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Tên</label>
          <div class="input-row">
            <input id="name" type="text" placeholder="Nhập tên" />
            <span id="nameStatus"></span>
          </div>
          <small id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="text" placeholder="example@gmail.com" />
          <small id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input id="password" type="password" placeholder="Nhập mật khẩu" />

          <div class="strength">
            <div id="strengthBar"></div>
          </div>

          <small id="passwordError"></small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Nhập lại mật khẩu</label>
          <input
            id="confirmPassword"
            type="password"
            placeholder="Nhập lại mật khẩu"
          />
          <small id="confirmError"></small>
        </div>

        <div class="form-group">
          <label for="phone">Số điện thoại</label>
          <input
            id="phone"
            type="text"
            placeholder="0901-234-567"
            maxlength="12"
          />
          <small id="phoneError"></small>
        </div>

        <button id="submitBtn" type="submit" disabled>Đăng ký</button>
      </form>
    </div>

    <div id="modal" class="modal-overlay hidden">
      <div class="modal">
        <h2>Đăng ký thành công!</h2>
        <div id="modalContent"></div>
        <button id="closeModal">Đóng</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
