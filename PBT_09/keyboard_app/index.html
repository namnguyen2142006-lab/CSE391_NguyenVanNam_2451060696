<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Keyboard Gallery</h1>

        <button id="openPaletteBtn" aria-label="Mở command palette">
          Ctrl + K
        </button>
      </header>

      <section class="gallery" aria-label="Gallery ảnh">
        <button id="prevBtn" aria-label="Ảnh trước">←</button>

        <div class="image-box">
          <img id="galleryImage" src="" alt="Gallery image" />
          <p id="imageCaption"></p>
        </div>

        <button id="nextBtn" aria-label="Ảnh tiếp theo">→</button>
      </section>

      <div class="actions">
        <button id="playBtn" aria-label="Play hoặc pause slideshow">
          Play
        </button>

        <button id="openModalBtn" aria-label="Mở modal ảnh">Open Modal</button>
      </div>

      <p class="hint">
        Phím tắt: ← → chuyển ảnh | 1-9 chọn ảnh | Space play/pause | Ctrl+K mở
        command palette | Escape đóng modal
      </p>
    </main>

    <div id="imageModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <img id="modalImage" src="" alt="Ảnh phóng to" />
        <button id="closeModalBtn" aria-label="Đóng modal">Đóng</button>
      </div>
    </div>

    <div
      id="paletteOverlay"
      class="palette-overlay hidden"
      role="dialog"
      aria-modal="true"
    >
      <div class="palette">
        <input
          id="commandInput"
          type="text"
          placeholder="Gõ command..."
          aria-label="Tìm command"
        />

        <ul id="commandList"></ul>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
