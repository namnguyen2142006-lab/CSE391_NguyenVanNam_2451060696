<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý sinh viên</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Quản lý sinh viên</h1>

    <button id="btnOpenForm">Thêm sinh viên</button>

    <div id="message"></div>

    <div class="statistics">
      <p>Tổng số sinh viên: <span id="totalStudents">0</span></p>
      <p>Điểm trung bình lớp: <span id="averageScore">0</span></p>
    </div>
    <table>
      <thead>
        <tr>
          <th>Mã SV</th>
          <th>Họ và tên</th>
          <th>Ngày sinh</th>
          <th>Lớp học</th>
          <th>Điểm TB</th>
          <th>Email</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody id="studentTableBody">
        <tr>
          <td>SV001</td>
          <td>Nguyễn Văn A</td>
          <td>2005-01-01</td>
          <td>K66A</td>
          <td>8.5</td>
          <td>a@gmail.com</td>
          <td>
            <button>Sửa</button>
            <button>Xóa</button>
          </td>
        </tr>

        <tr>
          <td>SV002</td>
          <td>Trần Thị B</td>
          <td>2005-03-12</td>
          <td>K66B</td>
          <td>7.8</td>
          <td>b@gmail.com</td>
          <td>
            <button>Sửa</button>
            <button>Xóa</button>
          </td>
        </tr>

        <tr>
          <td>SV003</td>
          <td>Lê Văn C</td>
          <td>2005-07-20</td>
          <td>K66C</td>
          <td>9.2</td>
          <td>c@gmail.com</td>
          <td>
            <button>Sửa</button>
            <button>Xóa</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="formTitle">Thêm sinh viên</h2>

        <form id="studentForm">
          <input type="text" id="studentId" placeholder="Mã sinh viên" />

          <input type="text" id="fullName" placeholder="Họ và tên" />

          <input type="date" id="birthday" />

          <input type="text" id="className" placeholder="Lớp học" />

          <input type="number" id="score" placeholder="Điểm trung bình" />

          <input type="email" id="email" placeholder="Email" />

          <button type="submit">Lưu</button>

          <button type="button" id="btnCloseForm">Hủy</button>
        </form>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
